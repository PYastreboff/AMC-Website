<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/amc-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Australian Male Choir — professional male voices performing from harmonised Italian arias to jazz and pop, across Australia and internationally." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <title>Australian Male Choir · AMC</title>
    <script>
      // GitHub Pages SPA routing: dist/404.html (generated at build time)
      // saves the intended path and bounces to /. Restore it here, before
      // the app bundle boots, so React Router renders the right route.
      ;(function () {
        var path = sessionStorage.getItem('spa-redirect')
        if (path) {
          sessionStorage.removeItem('spa-redirect')
          history.replaceState(null, '', path)
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
