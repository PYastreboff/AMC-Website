name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages-formspree]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Formspree form ID (public by design — it's the form's action URL).
          # Set under Settings → Secrets and variables → Actions → Variables.
          VITE_FORMSPREE_ID: ${{ vars.VITE_FORMSPREE_ID }}

      # Pages can't rewrite unknown paths to index.html, so emit a 404.html
      # that restores deep links (see scripts/gh-pages-404.mjs).
      - name: SPA fallback
        run: node scripts/gh-pages-404.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
